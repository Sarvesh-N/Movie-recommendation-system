name: deploy-ml-app

on:
  workflow_run:
    workflows: ["build-test-ml-app"]
    types:
      - completed

jobs:
  deploy:
    # deploy only if CI workflow passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      # checkout repository
      - name: checkout repo
        uses: actions/checkout@v4
        with: 
          lfs: true

      # login to dockerhub
      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # build docker image
      - name: build docker image
        run: docker build -t sarvs99/movie-rec-sys:latest .

      # push image to dockerhub
      - name: push docker image
        run: docker push sarvs99/movie-rec-sys:latest

      # connect to server and deploy container
      - name: deploy app on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Pulling latest image..."

            docker pull sarvs99/movie-rec-sys:latest

            echo "Stopping old container..."

            docker stop movie-rec-container || true
            docker rm movie-rec-container || true

            echo "Removing unused images..."

            docker image prune -af

            echo "Starting new container..."

            docker run -d \
              --name movie-rec-container \
              -p 8501:8501 \
              --restart always \
              sarvs99/movie-rec-sys:latest

            echo "Deployment completed successfully"

      # deployment verification
      - name: verify deployment
        run: echo "Application deployed successfully"
